name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.3"
            forge: "66.0.2"
          - mc: "26.2"
            forge: "65.1.5"
          - mc: "26.1.2"
            forge: "64.1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - run: gradle build -Pminecraft_version=${{ matrix.mc }} -Pforge_version=${{ matrix.forge }}
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.mc }}
          path: build/libs/*.jar