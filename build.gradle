plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = "${mod_version}+${minecraft_version}"
group = 'com.quickswaphotkeys'

base {
    archivesName = 'quick-swap-hotkeys-forge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

minecraft {
    runs {
        client {
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version
    }
}
